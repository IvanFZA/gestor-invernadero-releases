
name: Control de revisiones

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  clasificar:
    runs-on: ubuntu-latest

    steps:
      - name: Clasificar observaciones
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue = context.payload.issue;

            // El Issue #1 es la solicitud oficial.
            if (!issue || issue.number === 1 || issue.pull_request) {
              return;
            }

            // 27 de octubre, 00:00 en Ciudad de México (UTC-6).
            const limite = Date.parse("2026-10-27T06:00:00Z");

            if (context.eventName === "issues") {
              const fecha = Date.parse(issue.created_at);
              const etiqueta = fecha < limite
                ? "Dentro del plazo"
                : "Fuera de plazo";

              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: issue.number,
                labels: [etiqueta]
              });

              core.info(`Issue #${issue.number}: ${etiqueta}`);
            }

            if (context.eventName === "issue_comment") {
              const comentario = context.payload.comment;
              const fecha = Date.parse(comentario.created_at);

              if (fecha >= limite) {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: issue.number,
                  labels: ["Fuera de plazo"]
                });

                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issue.number,
                  body:
                    "⏰ **Registro de observación fuera de plazo**\n\n" +
                    `El comentario de @${comentario.user.login} ` +
                    `fue registrado el ${comentario.created_at} (UTC), ` +
                    "después del cierre del periodo de revisión.\n\n" +
                    `Comentario original: ${comentario.html_url}\n\n` +
                    "La observación permanece disponible para seguimiento."
                });
              }
            }
